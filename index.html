*,*::before,*::after{box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');
.lr{overflow-x:clip;max-width:100%;background:#171210;background-image:radial-gradient(1100px 560px at 50% -8%, #2b2115 0%, #171210 62%);color:#e8d9b8;font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;font-size:17px;line-height:1.45}
.shell{position:relative;min-height:100vh}
.scroll{width:100%}
.bar{flex:0 0 auto}
.disp{font-family:'Cinzel',serif;letter-spacing:.1em}
.panel{background:linear-gradient(165deg,#261d15,#1d1610);border:1px solid #3e2f1f;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.btn{font-family:'Cinzel',serif;letter-spacing:.07em;font-size:12px;text-transform:uppercase;padding:10px 14px;border-radius:8px;border:1px solid #6d5426;background:linear-gradient(180deg,#3a2c18,#2a1f10);color:#dfc389;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.18)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-blood{border-color:#7c2a22;background:linear-gradient(180deg,#5c221b,#411713);color:#eab6a8}
.btn-ghost{background:transparent;border-color:#4a3a26;color:#b9a37c}
.gold{color:#d8ac5f}.blood{color:#d96f5d}.laurel{color:#9aa86a}.dim{color:#b09b7d}
.tag{display:inline-block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border:1px solid #4a3a26;border-radius:99px;color:#b9a37c}
.tag-blood{border-color:#7c2a22;color:#d98476}
.tag-gold{border-color:#8a6a2c;color:#e0bd72}
.track{height:7px;border-radius:99px;background:#120d09;border:1px solid #33271a;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .4s}
.tabbtn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 7px;color:#a08d6b;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.04em;text-transform:uppercase;background:none;border:none;cursor:pointer;border-top:2px solid transparent;overflow:hidden;white-space:nowrap}
.tabbtn.on{color:#e0bd72;border-top-color:#c99a4b}
.modalwrap{position:fixed;inset:0;background:rgba(10,7,5,.84);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{width:100%;max-width:560px;box-sizing:border-box;max-height:92vh;overflow-y:auto;background:linear-gradient(170deg,#292017,#1a1410);border:1px solid #4e3c26;border-radius:14px 14px 0 0;padding:18px}
@media(min-width:640px){.modalwrap{align-items:center}.modal{border-radius:14px}}
.tickline{padding:4px 0;border-bottom:1px dotted #33271a;animation:tick .35s ease-out}
@keyframes tick{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sel{background:#1a1410;border:1px solid #4a3a26;color:#e8d9b8;border-radius:7px;padding:8px 10px;font-family:'Cormorant Garamond',Georgia,serif;font-size:15px}
.chip{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:6px 10px;border-radius:99px;border:1px solid #4a3a26;background:none;color:#b9a37c;cursor:pointer}
.chip.on{border-color:#c99a4b;color:#e0bd72;background:#2b2115}
.focusbtn{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.04em;min-height:46px;padding:8px 4px;
  border-radius:8px;border:1px solid #4a3a26;background:#1a1410;color:#b9a37c;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;transition:border-color .15s}
.focusbtn:hover{border-color:#6d5426}
.focusbtn.on{border-color:#c99a4b;color:#e8d092;background:linear-gradient(180deg,#3a2c18,#2a1f10)}
.focusbtn .sub{font-family:'Cormorant Garamond',Georgia,serif;font-size:10.5px;letter-spacing:0;opacity:.75}
.arena{position:relative;overflow:hidden;border-radius:10px;border:1px solid #4e3c26;height:232px;
  background:linear-gradient(#0d0a07 0%,#14100b 26%,#2a2013 29%,#3f2f1a 33%,#6d5531 58%,#9a7844 100%)}
.v-pit{background:linear-gradient(#0a0806 0%,#100d09 30%,#241c12 34%,#4a3a22 62%,#6b5433 100%)!important;border-color:#3e2f1f!important}
.v-yard{background:linear-gradient(#0f0d0c 0%,#1a1715 24%,#3a3630 28%,#6e6a62 40%,#a8a498 72%,#c9c5b8 100%)!important;border-color:#6d6656!important}
.v-field{background:linear-gradient(#0b0d08 0%,#131710 26%,#26301c 31%,#3d4b2a 55%,#5c6f3c 100%)!important;border-color:#4a5a35!important}
.v-amphi{background:linear-gradient(#0d0a07 0%,#181209 22%,#3a2c18 27%,#6d5531 55%,#a88a52 100%)!important;border-color:#6d5426!important}
.v-imperial{background:linear-gradient(#0d0a09 0%,#1c1510 20%,#4a3820 26%,#8a6c3c 52%,#cba765 100%)!important;border-color:#c99a4b!important}
.v-harbour{background:linear-gradient(#0a0c0e 0%,#121820 24%,#2c3038 29%,#6a6250 56%,#9d9068 100%)!important;border-color:#5a6270!important}
.wound{position:absolute;border-radius:50%;background:#7c1d14;pointer-events:none}
.arenashake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
.crowdrow{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:0 4px;overflow:hidden}
.chead{width:9px;border-radius:99px 99px 2px 2px;background:#0b0806;flex:0 0 auto}
.roar{position:absolute;inset:0;pointer-events:none;transition:opacity .5s;
  background:radial-gradient(70% 46% at 50% 2%, rgba(255,186,92,.22), transparent 72%)}
.dust{position:absolute;left:0;right:0;bottom:0;height:52px;pointer-events:none;
  background:radial-gradient(60% 100% at 50% 100%, rgba(224,189,114,.13), transparent 70%)}
.fig{position:absolute;bottom:14px;transition:transform .26s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 100%}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.spurt{position:absolute;width:5px;height:5px;border-radius:99px;background:#a81d14;pointer-events:none;animation:spr .72s ease-out forwards}
@keyframes spr{0%{opacity:.95;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.35)}}
.hitflash{position:absolute;inset:0;pointer-events:none;background:rgba(200,40,25,.16);animation:flash .3s ease-out forwards}
@keyframes flash{to{opacity:0}}
.momtrack{height:5px;border-radius:99px;background:#120d09;border:1px solid #33271a;position:relative;overflow:hidden}
.momfill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#8a6a2c,#d8ac5f);transition:all .3s}
.caption{min-height:52px;font-size:16.5px;line-height:1.34}
:focus-visible{outline:2px solid #e0bd72;outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.rowname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.items-center{align-items:center}.items-end{align-items:flex-end}

.selbtn:hover{border-color:#6d5426}

.optrow.on{border-color:#c99a4b;background:linear-gradient(165deg,#332816,#241b11)}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

.sect>summary{list-style:none;cursor:pointer;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;

.sect[open]>summary .chev{transform:rotate(180deg)}
.sect>.sectbody{padding:0 13px 13px}

or>=70?`${tt.name} raises a hand from the editor's box before the crowd has finished deciding. MISSIO \u2014 ${Q.he} is spared, and every lanista in Capua saw who spoke for you.`:`MISSIO. The editor's hand opens. ${Q.He} is spared \u2014 carried bleeding from the sand.`,{actor:"A"})):(_=!0,de("death",`The thumb turns. The blow falls true. ${e.name} dies as gladiators die \u2014 on the sand, before the crowd.`,{actor:"A"}))}else de("appeal",`${t.name} raises two fingers in appeal...`,{actor:"B"}),k>62&&N()<.55?(U=!0,de("death",`The crowd howls for blood, and the editor grants it. ${e.name} sends ${fe.him} across the river.`,{actor:"B"})):(Ce=!0,de("spared","Missio \u2014 the beaten fighter is spared, and the crowd salutes your victor.",{actor:"B"}))}return{beats:m,winner:J,crowd:k,fell:q,vA:S,vB:L,aDies:_,bDies:U,lastTarget:V,spared:Ce}}var YC=[{id:"loop",tab:"ludus",title:"The Week",text:"A week is all you get at a time. Set what each man does, take what fights you want, spend what you dare \u2014 then end it. Everything happens at once when you do: training, wounds mending, the rivals moving, the coin going out."},{id:"unrest",tab:"ludus",title:"The Fire in the Cells",text:"Watch that red bar more closely than the gold. People who are worked, whipped and buried get to talking. Feasts, victories and freedom cool it. If it reaches its height, none of the rest of this matters."},{id:"men",tab:"men",title:"They Are Not Numbers",text:"Everyone here has an origin, a temper and a ceiling you cannot see. Bearing tells you how much fire is in them \u2014 the best fighters carry the most, which is the whole problem with owning them."},{id:"regimen",tab:"men",title:"The Palus and the Pair",text:"Post work is safe and slow. Sparring is far faster, and a man learns most from someone better than himself \u2014 but partners get hurt, and two men who hate each other will go too hard. Conditioning builds wind and sheds fatigue. Rest mends."},{id:"arena",tab:"arena",title:"Stakes",text:"First blood ends at the first real wound and nobody dies. To surrender leaves it to the editor and the crowd. To the death is exactly that. The pits are always open and pay badly; the games come every third week once anyone has heard of you."},{id:"bets",tab:"arena",title:"The Bookmakers",text:"You may lay coin on your own fighter, or against them. Against means they are told to go down \u2014 and they will know you asked, whatever the crowd sees. The familia remembers that longer than the whip."},{id:"armory",tab:"armory",title:"Steel and Style",text:"Standard kit is always free on the racks. Bought pieces arm one man at a time. Gear outside a man's own style still works, but clumsily \u2014 a net-man in a legionary's shield is worse than useless."},{id:"market",tab:"market",title:"The Slaver's Block",text:"Age is most of the price. A fighter is in their prime from 23 to 28; before that they are still growing, after it they start giving pieces back. Veterans come cheap, already scarred, and already schooled."},{id:"villa",tab:"villa",title:"Those Who Watch",text:"Favor is not a number you bank \u2014 it is what four particular Romans think of you. Keep one of them warm and he leans on the editor when your man is in the sand. Let them all go cold and you will notice at the worst moment."},{id:"agenda",tab:"ludus",title:"What Wants Answering",when:e=>e.week>=2,text:"That list at the top is the only part of this screen you have to read. It is everything with your name on it this week, worst first, and each line will put you where the answer is. When it says now, it means this week and not the next one."},{id:"season",tab:"ludus",title:"The Year Turns",when:e=>e.week>=10,text:"Eighteen weeks to a year, and the weather in them is not decoration. Spring is when a man learns fastest. Summer is the season of games and the sand burns anyone who goes down on it. Autumn brings the harvest money and the best purses you will see. Winter shuts the sand, costs you four denarii a man extra, and mends wounds faster than any other season, because there is nothing else for anybody to do."},{id:"book",tab:"ludus",title:"What The House Has Done",when:e=>(e.book&&e.book.n)>=25,text:"The record book keeps everything: which style has actually served you, which stakes you should stop accepting, which of the three great houses is quietly taking you apart. Most lanistae have a feeling about these things. You can have the number."},{id:"heir",tab:"ludus",title:"After You",when:e=>e.lanista&&(e.lanista.age>=48||e.lanista.health<55),text:"You are not a permanent fixture. Age, a house on the edge of fire, and every man you bury take something out of you, and when it runs out the school is sold off in pieces the morning after \u2014 unless you have put a name to it. A son, a nephew, or the doctore you freed. They inherit the men and the debts and none of your reputation."},{id:"drills",tab:"men",title:"The Week's Work",text:"Eight things a man can do with his week, and none of them are free. The weights build strength half again as fast and take his speed. The hill works the tiredness out of him instead of in. Sparring teaches him whatever his partner is better at, which is not always what you picked. And watch the strain: it is the deep tiredness a night does not touch, it eats what he gains, and only rest takes it off."},{id:"regard",tab:"men",title:"What He Makes Of You",when:e=>H(e).some(t=>(t.memory||[]).length>0),text:"He is keeping a list. The bout you stopped to save him, the promise you kept, the brother you freed \u2014 and the brother you sold, the wound you sent him out on, the night you left him on the sand until he had to finish one of his own. A man who would follow you anywhere fights measurably harder and cannot be bought at any price. One who hates you will one day sit down and not get up."},{id:"form",tab:"men",title:"Lately",when:e=>H(e).some(t=>Math.abs(Ut(t))>=24),text:"Form is the four weeks between his last bout and his next. Three straight wins and he walks out expecting to win; carried off twice and he has not been right since. It is a small thing and it fades inside a month, but it is the difference between sending him out now and sending him out later."},{id:"refusal",tab:"men",title:"A Man Who Sits Down",when:e=>H(e).some(t=>pa(t))||H(e).some(t=>ue(t)<=26),text:"Sooner or later one of them will not go out, and the reason will be something you did. Open his page in the familia and settle it there \u2014 any week, not just the day it starts. The whip works and costs you every other man in the room. Talking is free and unreliable and depends entirely on what you have been to him. Giving him the thing he wanted works outright. And leaving him where he is teaches the whole block that sitting down can be survived."},{id:"stands",tab:"arena",title:"Four Crowds, Not One",when:e=>e.fame>=60,text:"Capua is not one crowd. The parmularii want the small shield, the scutarii want the big one, and they have hated each other since before you were born \u2014 you cannot please both. The mob in the upper tiers wants blood; the front rows want craft and can afford to. Whoever is warmest to you sets the purses you are offered."},{id:"venue",tab:"arena",title:"Where It Happens",when:e=>e.fame>=40,text:"The ground decides who you should send. A magistrate's courtyard is marble and favours a quick man; a field cut outside the walls is turf and favours a heavy one. It is on every offer before you commit, and it is worth reading."},{id:"watch",tab:"arena",title:"A Week To Look At Him",when:e=>e.games&&e.games.offers&&e.games.offers.length>0,text:"You can pay to have an opponent watched before the bout. What comes back is specific: that he is blowing by the sixth, that he drops his arm every time he lands one, that he has almost no bouts behind him. Then pick a plan against what you were told. Read him right and it is worth seven bouts in a hundred; read him wrong and it costs five."},{id:"circuit",tab:"arena",title:"Down The Bay",when:e=>e.fame>=150,text:"Three towns will have you: Pompeii wants blood, Neapolis knows the styles, Puteoli has money and nothing to spend it on. Nothing you built here travels with you \u2014 the editor there weighs what he has seen himself, and a man of yours who falls in front of a town that has never heard of him is spared about half the time. Win there enough and they learn the name."},{id:"lenders",tab:"villa",title:"Three Men With Coin",when:e=>e.gold<400,text:"Novius Gratus is cheap because he does not need to argue and he collects in gladiators. Titus Murena is dear and unhurried and never touches your men. Scaeva lends to anybody at a price that explains why. It compounds every week, it is entirely survivable if you pay it down, and it is very hard to stop taking once you have started."},{id:"aedile",tab:"villa",title:"The Man Who Runs The Games",when:e=>!!e.election||!!e.aedile,text:"Once a year Capua elects the aedile, and the aedile decides whose men are on the card, what they are paid, and whether anyone leans forward when one of them is down. You can back a candidate quietly, or openly with your name on the list, or stay out of it. Back the winner and you have the games for a year. Back the loser and he knows exactly whose name was on the other list."},{id:"collegium",tab:"villa",title:"A Stone With His Name",when:e=>e.week>=14,text:"Three denarii a week per man puts the house into a burial society. It never wins you a bout. What it does is halve what a death costs the cells, because men who know what happens to them afterward take a burial differently. It is the easiest line to cut in a bad month, and stopping it after men have gone into the ground under it costs double what stopping it before does."},{id:"munera",tab:"villa",title:"Games For Your Own Dead",when:e=>(e.unburied||[]).some(t=>!t.done),text:"Funeral games are what a rich man's sons stage at his tomb. Nobody has ever staged them for a gladiator. You have six weeks to burn a fire at the gate with his name said aloud, or put on a full card at your own expense \u2014 or do nothing, which costs no money and which the men notice more than either of the others."},{id:"scout",tab:"market",title:"The Seller's Version",text:"Those numbers are what the man selling him says. He overstates a sound man by about two points a stat and a flawed one by twice that, and roughly a third of the block has something wrong with it \u2014 an old wound, a spirit already broken, a temper sold twice in a year. Your doctore narrows the range. Paying to have him looked over gives you the number and names the problem."},{id:"staff",tab:"market",title:"The Men In The Rooms",when:e=>ho.some(t=>je(e,t)>0),text:"The infirmary and the armoury are rooms. What matters is who is standing in them. A good medicus mends faster and keeps a wound from setting badly; a good armourer makes steel cheaper, longer-lasting and quicker to repair. Both will leave \u2014 one if you fill his table every week, the other if you pay him late twice \u2014 and a rival with a grudge can buy either out from under you."},{id:"wear",tab:"armory",title:"Steel Does Not Last",when:e=>e.gladiators.some(t=>Me.some(a=>Ne(ee[t.kit&&t.kit[a]]))),text:"House stock is maintained and lasts forever. Bought steel wears every bout and eventually breaks in the middle of one. Watch the condition, have it mended before it goes, and remember that a fine blade at nothing left is worse than the plain one on the rack."}],VC=(e,t)=>YC.find(a=>{if(a.tab!==t||(e.flags.learned||{})[a.id])return!1;if(!a.when)return!0;try{return!!a.when(e)}catch{return!1}}),KC={rest:{name:"Let it mend",desc:"The slow way. He is off the sand until it closes."},surgeon:{name:"The surgeon",desc:"Cut, cleaned and stitched properly. Halves the time and most of the scarring."},through:{name:"Work him through it",desc:"He fights and trains on it. The wound does not close, and it may set badly."}},by=(e,t)=>z((55+t.pen*14)*[1,.85,.75,.65][
